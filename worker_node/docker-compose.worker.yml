services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5-worker-node
    restart: unless-stopped
    network_mode: "host"
    environment:
      - "HUB_URL=${HUB_URL:-http://34.131.83.26:8000}"
      - "NODE_ID=${NODE_ID:-vps-linux-worker-01}"
      - "NODE_NAME=${NODE_NAME:-Linux Cloud Worker 1}"
      - "NODE_API_KEY=${NODE_API_KEY:-mt5-cluster-secret-key-2026}"
      - MASTER_MT5_DIR=${MASTER_MT5_DIR:-/app/master_mt5}
      - CLIENTS_DIR=/app/CLIENTS
      - MAX_TERMINALS=${MAX_TERMINALS:-30}
      - POLL_INTERVAL=8
    volumes:
      - ./CLIENTS:/app/CLIENTS
      - ../Master MT5:/app/master_mt5:ro
    ipc: host
