services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5-worker-node
    restart: unless-stopped
    network_mode: "host"
    environment:
      - "HUB_URL=${HUB_URL:-http://34.131.83.26:8000}"
      - "NODE_ID=${NODE_ID:-vps-linux-worker-01}"
      - "NODE_NAME=${NODE_NAME:-Linux Cloud Worker 1}"
      - "NODE_API_KEY=${NODE_API_KEY:-mt5-cluster-secret-key-2026}"
      - "MASTER_MT5_DIR=${MASTER_MT5_DIR:-/app_data/Master MT5}"
      - "CLIENTS_DIR=${CLIENTS_DIR:-/app_data/worker_node/CLIENTS}"
      - MAX_TERMINALS=${MAX_TERMINALS:-30}
      - POLL_INTERVAL=8
      - "FAST_POLL_INTERVAL=${FAST_POLL_INTERVAL:-0.08}"
      - "COMMAND_POLL_INTERVAL=${COMMAND_POLL_INTERVAL:-0.15}"
      - "TELEMETRY_INTERVAL=${TELEMETRY_INTERVAL:-2.0}"
      - "SPAWN_STAGGER_DELAY=${SPAWN_STAGGER_DELAY:-6.0}"
      - "SPAWN_TIMEOUT=${SPAWN_TIMEOUT:-35.0}"
    volumes:
      - ../:/app_data
    ipc: host
