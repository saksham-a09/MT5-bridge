services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5-worker-node
    restart: unless-stopped
    network_mode: "host"
    environment:
      - "HUB_URL=${HUB_URL:-http://34.131.83.26:8000}"
      - "NODE_ID=${NODE_ID:-vps-linux-worker-01}"
      - "NODE_NAME=${NODE_NAME:-Linux Cloud Worker 1}"
      - "NODE_API_KEY=${NODE_API_KEY:-mt5-cluster-secret-key-2026}"
      - MASTER_MT5_DIR=${MASTER_MT5_DIR:-/app/master_mt5}
      - CLIENTS_DIR=/app/CLIENTS
      - MAX_TERMINALS=${MAX_TERMINALS:-30}
      - POLL_INTERVAL=8
      - "FAST_POLL_INTERVAL=${FAST_POLL_INTERVAL:-0.08}"
      - "SLAVE_POS_INTERVAL=${SLAVE_POS_INTERVAL:-1.0}"
      - "COMMAND_POLL_INTERVAL=${COMMAND_POLL_INTERVAL:-0.40}"
      - "SLAVE_CMD_POLL_INTERVAL=${SLAVE_CMD_POLL_INTERVAL:-0.12}"
      - "TELEMETRY_INTERVAL=${TELEMETRY_INTERVAL:-2.0}"
      - "PYTHONDONTWRITEBYTECODE=1"
      - "PYTHONOPTIMIZE=1"
    volumes:
      - ./CLIENTS:/app/CLIENTS
      - ../Master MT5:/app/master_mt5:ro
    tmpfs:
      - /tmp:size=128M
      - /dev/shm:size=256M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ipc: host
