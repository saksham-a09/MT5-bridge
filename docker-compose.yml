services:
  # API Controller (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      - HUB_HOST=0.0.0.0
      - HUB_PORT=8000
      - HUB_DB_PATH=/app/data/hub.db
      - HUB_SECRET_KEY=mt5-cluster-secret-key-2026
      - HEARTBEAT_TIMEOUT_SECONDS=30
    volumes:
      - hub-db-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/nodes')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mt5-cluster-net

  # Web Dashboard & Nginx Gateway (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"        # Web Dashboard (HTTP)
      - "3000:80"      # Web Dashboard alternative
      - "8000:8000"    # Worker Node Gateway (Proxied through Nginx)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mt5-cluster-net

volumes:
  hub-db-data:
    driver: local

networks:
  mt5-cluster-net:
    driver: bridge
